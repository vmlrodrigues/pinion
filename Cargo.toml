[package]
name = "pinion"
version = "0.27.0"
authors = [ "Hamid Ghadyani <hamid@hamid.cc>", "Victor Rodrigues",]
edition = "2021"
description = "Alfred workflow for Pinboard.in bookmarks, written in Rust."
license = "MIT"
repository = "https://github.com/vmlrodrigues/pinion"

[dependencies]
alfred = "4.0.1"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
semver = "1.0.4"
thiserror = "1.0"
dirs = "5.0"
log = "0.4"
env_logger = "0.10"

[features]

# Both of these are vendored under vendor/ rather than pulled from crates.io or
# git. Upstream has been dormant since 2023, and as external dependencies they
# were the project's biggest fragility: rusty-pin is not on crates.io, has no
# other fork, and its master branch is API-incompatible with this code, so any
# `cargo update` broke the build. Vendoring also let us drop `atty` from the
# tree. See vendor/README.md.
[dependencies.alfred-rs]
path = "vendor/alfred-rs"

[dependencies.rusty-pin]
path = "vendor/rusty-pin"

[dependencies.chrono]
version = "0.4"
features = [ "serde",]

[profile.release]
lto = true

[package.metadata.docs.rs]
targets = [ "x86_64-apple-darwin",]

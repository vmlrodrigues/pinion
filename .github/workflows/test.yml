name: tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - master
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Use the toolchain pinned in rust-toolchain.toml.
      - name: Install pinned toolchain
        run: rustup show

      - name: Test Pinion and its vendored libraries
        # The vendored tests share environment variables and a mock server port.
        run: cargo test --locked --workspace --lib --bins -- --test-threads=1

      - name: Run Alfred workflow regression tests
        run: python3 tests/workflow_regression.py
